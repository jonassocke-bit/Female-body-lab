<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Female Model Lab v0.1</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0d10;color:#fff}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{
 position:fixed;left:18px;right:18px;bottom:18px;max-width:680px;margin:auto;
 padding:18px;border:1px solid rgba(255,255,255,.14);border-radius:22px;
 background:rgba(20,21,26,.76);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
 box-shadow:0 16px 60px rgba(0,0,0,.32)
}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:17px;margin:0}.tag{font-size:12px;opacity:.55}
.row{display:grid;grid-template-columns:110px 1fr 50px;gap:10px;align-items:center;margin:10px 0}
.row label{font-weight:650;font-size:14px}.value{text-align:right;font-variant-numeric:tabular-nums;opacity:.72}
input[type=range]{width:100%;accent-color:white}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{
 border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;
 border-radius:999px;padding:9px 13px;font-weight:650
}
button:active{background:#fff;color:#111}
.note{font-size:11px;line-height:1.35;opacity:.52;margin-top:10px}
.status{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.46);font-size:12px;opacity:.8}
@media (min-width:760px){.panel{left:auto;right:24px;bottom:24px;width:430px}.row{grid-template-columns:100px 1fr 46px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="app"></div>
<div class="status" id="status">Modell wird geladen …</div>
<section class="panel">
  <div class="head"><h1>Female Model Lab</h1><span class="tag">v0.1 · unabhängig</span></div>
  <div class="row"><label>Curvy</label><input id="overweight" type="range" min="0" max="1" step=".01" value="0"><span class="value" id="overweightV">0%</span></div>
  <div class="row"><label>Schlank</label><input id="skinny" type="range" min="0" max="1" step=".01" value="0"><span class="value" id="skinnyV">0%</span></div>
  <div class="row"><label>Muskulatur</label><input id="muscular" type="range" min="0" max="1" step=".01" value="0"><span class="value" id="muscularV">0%</span></div>
  <div class="row"><label>Arme</label><input id="pose" type="range" min="-1" max="1" step=".01" value="0"><span class="value" id="poseV">A-Pose</span></div>
  <div class="presets">
    <button data-preset="average">Average</button>
    <button data-preset="curvy">Curvy</button>
    <button data-preset="slim">Slim</button>
    <button data-preset="athletic">Athletic</button>
  </div>
  <div class="note">Nur Modelltest: kein Harness-Code. Weißes Material, keine Texturen, Augen oder Zähne. Ein Finger/Maus = drehen, Pinch/Mausrad = zoomen.</div>
</section>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

const host=document.getElementById('app'),status=document.getElementById('status');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x101116);
const camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.01,20);
camera.position.set(0,1.25,4.8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
host.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,.95,0);
controls.enableDamping=true; controls.dampingFactor=.07;
controls.minDistance=2.2;controls.maxDistance=7;

scene.add(new THREE.HemisphereLight(0xffffff,0x262936,2.4));
const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(2.5,4,3.5);scene.add(key);
const fill=new THREE.DirectionalLight(0xb8c8ff,1.3);fill.position.set(-3,2,1);scene.add(fill);

const floor=new THREE.Mesh(new THREE.CircleGeometry(1.35,64),new THREE.MeshStandardMaterial({color:0x262832,roughness:1}));
floor.rotation.x=-Math.PI/2; floor.position.y=.002; scene.add(floor);

let body=null,dict=null;
const loader=new GLTFLoader();
loader.load('./female_custom_morph.glb',g=>{
  scene.add(g.scene);
  body=g.scene.getObjectByProperty('isMesh',true);
  dict=body.morphTargetDictionary;
  body.material=new THREE.MeshStandardMaterial({color:0xf2f2f4,roughness:.68,metalness:0});
  status.textContent='18.004 Vertices · 36.004 Triangles · 5 Morph Targets';
  setTimeout(()=>status.style.opacity=.35,1800);
  updateMorphs();
},undefined,e=>{console.error(e);status.textContent='Fehler beim Modellladen'});

const els={};
for(const id of ['overweight','skinny','muscular','pose']){
  els[id]=document.getElementById(id);
  els[id].addEventListener('input',updateMorphs);
}
function percent(v){return Math.round(v*100)+'%'}
function updateMorphs(){
  document.getElementById('overweightV').textContent=percent(+els.overweight.value);
  document.getElementById('skinnyV').textContent=percent(+els.skinny.value);
  document.getElementById('muscularV').textContent=percent(+els.muscular.value);
  const p=+els.pose.value;
  document.getElementById('poseV').textContent=Math.abs(p)<.03?'A-Pose':p<0?'Gerade '+Math.round(-p*100)+'%':'Unten '+Math.round(p*100)+'%';
  if(!body||!dict)return;
  body.morphTargetInfluences[dict.Muscular]=+els.muscular.value;
  body.morphTargetInfluences[dict.Overweight]=+els.overweight.value;
  body.morphTargetInfluences[dict.Skinny]=+els.skinny.value;
  body.morphTargetInfluences[dict.ArmsStraight]=Math.max(0,-p);
  body.morphTargetInfluences[dict.ArmsDown]=Math.max(0,p);
}
const presets={
 average:[0,0,0,0],
 curvy:[.58,0,0,0],
 slim:[0,.58,0,0],
 athletic:[0,.10,.48,-.08]
};
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{
 const v=presets[b.dataset.preset];
 els.overweight.value=v[0];els.skinny.value=v[1];els.muscular.value=v[2];els.pose.value=v[3];updateMorphs();
}));

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)
});
function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();
</script>
</body>
</html>
